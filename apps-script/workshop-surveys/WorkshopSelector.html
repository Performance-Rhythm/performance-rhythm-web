<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body { font: 14px Arial, sans-serif; color: #202124; margin: 16px; }
      h2 { font-size: 18px; margin: 0 0 6px; }
      .hint { color: #5f6368; font-size: 12px; margin-bottom: 14px; }
      input[type="search"] { box-sizing: border-box; width: 100%; padding: 9px; border: 1px solid #dadce0; border-radius: 4px; }
      .actions { display: flex; gap: 8px; margin: 12px 0; }
      button { border: 0; border-radius: 4px; padding: 8px 12px; cursor: pointer; }
      .secondary { background: #f1f3f4; color: #202124; }
      .primary { background: #5e8aa8; color: white; width: 100%; margin-top: 12px; font-weight: bold; }
      #list { max-height: calc(100vh - 225px); overflow-y: auto; border-top: 1px solid #eee; border-bottom: 1px solid #eee; }
      label { display: flex; gap: 9px; align-items: flex-start; padding: 9px 3px; border-bottom: 1px solid #f1f3f4; }
      label span { line-height: 18px; }
      #status { min-height: 18px; margin-top: 8px; color: #5f6368; font-size: 12px; }
    </style>
  </head>
  <body>
    <h2>Choose workshops</h2>
    <div class="hint">Search, check any combination, then apply.</div>
    <input id="search" type="search" placeholder="Search company, session, or date" oninput="render()">
    <div class="actions">
      <button class="secondary" onclick="setVisible(true)">Select all</button>
      <button class="secondary" onclick="setVisible(false)">Clear</button>
    </div>
    <div id="list">Loading…</div>
    <button class="primary" onclick="applySelection()">Apply to dashboard</button>
    <div id="status"></div>
    <script>
      let workshops = [];
      google.script.run.withSuccessHandler(data => { workshops = data; render(); }).getWorkshopSelectorData();

      function visibleItems() {
        const query = document.getElementById('search').value.trim().toLowerCase();
        return workshops.filter(w => !query || w.label.toLowerCase().includes(query) || w.id.toLowerCase().includes(query));
      }

      function render() {
        const list = document.getElementById('list');
        const items = visibleItems();
        list.innerHTML = items.length ? items.map(w =>
          '<label><input type="checkbox" data-id="' + escapeHtml(w.id) + '" ' + (w.selected ? 'checked' : '') +
          ' onchange="toggle(\'' + jsString(w.id) + '\', this.checked)"><span>' + escapeHtml(w.label) + '</span></label>'
        ).join('') : '<div style="padding:12px;color:#5f6368">No matching workshops</div>';
      }

      function toggle(id, checked) { const item = workshops.find(w => w.id === id); if (item) item.selected = checked; }
      function setVisible(checked) { visibleItems().forEach(w => w.selected = checked); render(); }
      function applySelection() {
        const status = document.getElementById('status');
        status.textContent = 'Updating dashboard…';
        google.script.run.withSuccessHandler(result => {
          status.textContent = 'Dashboard updated: ' + result.selected + ' of ' + result.total + ' workshops selected.';
        }).withFailureHandler(error => { status.textContent = 'Could not update: ' + error.message; })
          .applyWorkshopSelection(workshops.filter(w => w.selected).map(w => w.id));
      }
      function escapeHtml(value) { return String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
      function jsString(value) { return String(value).replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }
    </script>
  </body>
</html>
